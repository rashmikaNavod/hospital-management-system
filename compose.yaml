name: hospital-management-system

services:
  auth-db:
    image: postgres:18
    environment:
      POSTGRES_DB: hospital_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "G:/DockerData/hospital-management-system/auth-db:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_auth"]
      interval: 5s  
      timeout: 5s
      retries: 10
